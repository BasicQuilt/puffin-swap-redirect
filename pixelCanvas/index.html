<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DDAO Pixel Canvas</title>
<style>
  :root {
    --bg:       #0d0d14;
    --surface:  #14141f;
    --border:   #1e1e30;
    --purple:   #7b2fbe;
    --purplhi:  #a855f7;
    --cyan:     #22d3ee;
    --text:     #e2e2f0;
    --muted:    #6b6b8a;
    --red:      #ef4444;
    --green:    #22c55e;
    --orange:   #f97316;
    --mono:     'JetBrains Mono', 'Fira Code', monospace;
    --sans:     'Inter', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  /* ─── Full-height layout: top bar → canvas → bottom bar ─────────── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100dvh; /* dvh handles mobile browser chrome */
    width: 100vw;
  }

  /* ─── Top bar ────────────────────────────────────────────────────── */
  .top-bar {
    flex-shrink: 0;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    z-index: 10;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--purplhi);
    box-shadow: 0 0 8px var(--purplhi);
    flex-shrink: 0;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.4; transform:scale(.8); }
  }

  .top-title {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .top-title b { color: var(--purplhi); font-weight: 600; }

  .top-spacer { flex: 1; }

  .pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 9px;
    font-family: var(--mono);
    font-size: 11px;
    flex-shrink: 0;
  }
  .pill-val { font-weight: 700; }
  .pill-val.p { color: var(--purplhi); }
  .pill-val.c { color: var(--cyan); }
  .pill-val.r { color: var(--red); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:.3; } }

  /* ─── Canvas area ────────────────────────────────────────────────── */
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0a0a10;
    cursor: crosshair;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transform-origin: 0 0;
  }

  .coord-tip {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(13,13,20,.9);
    border: 1px solid var(--purple);
    border-radius: 4px;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--cyan);
    pointer-events: none;
    display: none;
    z-index: 5;
  }

  /* Zoom buttons */
  .zoom-btns {
    position: absolute;
    top: 8px; left: 8px;
    display: flex;
    gap: 4px;
    z-index: 5;
  }

  .zoom-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(20,20,31,.88);
    backdrop-filter: blur(6px);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-btn:active { opacity: .6; }

  /* ─── Color bar (horizontal, always visible) ─────────────────────── */
  .color-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .color-bar::-webkit-scrollbar { display: none; }

  .color-label {
    font-size: 9px;
    font-family: var(--mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    flex-shrink: 0;
  }

  .swatch {
    width: 28px; height: 28px;
    border-radius: 5px;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .1s, border-color .1s;
  }
  .swatch:active    { transform: scale(.9); }
  .swatch.selected  { border-color: #fff; box-shadow: 0 0 0 1px var(--purplhi); }

  /* ─── Bottom action bar — ALWAYS VISIBLE ─────────────────────────── */
  .action-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Selected color preview in action bar */
  .sel-color {
    width: 38px; height: 38px;
    border-radius: 8px;
    border: 2px solid var(--border);
    flex-shrink: 0;
  }

  .undo-btn {
    height: 38px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .undo-btn:active:not(:disabled) { opacity: .6; }
  .undo-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* THE SAVE BUTTON — takes remaining space, impossible to miss */
  .save-btn {
    flex: 1;
    height: 44px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #16a34a, var(--green));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 0 18px rgba(34,197,94,.35);
    transition: opacity .15s, transform .1s;
    letter-spacing: .02em;
    min-width: 0;
  }
  .save-btn:active:not(:disabled) { transform: scale(.97); }
  .save-btn:disabled {
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }

  .save-count {
    background: rgba(255,255,255,.25);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 12px;
    font-weight: 700;
  }
  .save-btn:disabled .save-count {
    background: var(--border);
    color: var(--muted);
  }

  /* ─── Toast ──────────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 130px; /* above action + color bars */
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(20,20,31,.96);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--text);
    z-index: 50;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    white-space: nowrap;
    max-width: 88vw;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show               { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.warn               { border-color:var(--orange); color:var(--orange); }
  .toast.error              { border-color:var(--red);    color:var(--red); }
  .toast.ok                 { border-color:var(--green);  color:var(--green); }

  /* ─── Screens ────────────────────────────────────────────────────── */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
    background: var(--bg);
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--purplhi);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .screen-text {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .1em;
  }

  #doneScreen {
    background: rgba(13,13,20,.97);
    display: none;
  }

  .done-icon { font-size: 58px; animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

  .done-title { font-size: 24px; font-weight: 700; color: var(--green); }
  .done-sub   { font-size: 14px; color: var(--muted); max-width:320px; line-height:1.7; }
  .done-sub b { color: var(--text); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- Load screen -->
<div class="screen" id="loadScreen">
  <div class="spinner"></div>
  <div class="screen-text" id="loadText">Loading session…</div>
</div>

<!-- Done screen -->
<div class="screen" id="doneScreen">
  <div class="done-icon">✅</div>
  <div class="done-title">Pixels saved!</div>
  <div class="done-sub">Go back to Discord and tap <b>Submit Pixels</b> to place them on the canvas.</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Shell -->
<div class="shell">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="logo-dot"></div>
    <div class="top-title">DDAO <b>Canvas</b></div>
    <div class="top-spacer"></div>
    <div class="pill">
      <span style="color:var(--muted)">Left</span>
      <span class="pill-val p" id="creditsLeft">—</span>
    </div>
    <div class="pill">
      <span style="color:var(--muted)">Placed</span>
      <span class="pill-val c" id="placedCount">0</span>
    </div>
    <div class="pill">
      ⏱ <span class="pill-val" id="timerVal">—</span>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas-area" id="canvasArea">
    <canvas id="cvs"></canvas>
    <div class="coord-tip" id="coordTip"></div>
    <div class="zoom-btns">
      <button class="zoom-btn" id="zIn">+</button>
      <button class="zoom-btn" id="zOut">−</button>
      <button class="zoom-btn" id="zReset" style="font-size:13px">⊡</button>
    </div>
  </div>

  <!-- Color scroll bar — always visible, scroll horizontally for more -->
  <div class="color-bar" id="colorBar">
    <span class="color-label">Color →</span>
  </div>

  <!-- Action bar — save button always full width on the right -->
  <div class="action-bar">
    <div class="sel-color" id="selColor"></div>
    <button class="undo-btn" id="btnUndo" disabled>↩ Undo</button>
    <button class="save-btn" id="btnSave" disabled>
      ✅ Save &amp; Return
      <span class="save-count" id="saveCount">0</span>
    </button>
  </div>

</div>

<script>
// ── Palette ────────────────────────────────────────────────────────────────────
const PALETTE = [
  '#FF0000','#FF4500','#FF8800','#FFD700','#FFFF00','#AAFF00',
  '#00FF00','#00FF88','#00FFFF','#00AAFF','#0055FF','#0000FF',
  '#8800FF','#CC00FF','#FF00FF','#FF0088','#FF69B4','#FF99AA',
  '#FFFFFF','#DDDDDD','#AAAAAA','#777777','#444444','#000000',
  '#8B4513','#A0522D','#D2691E','#F4A460','#DEB887','#FFDEAD',
  '#228B22','#2E8B57','#20B2AA','#4169E1','#7B2FBE','#DC143C',
];

// ── State ──────────────────────────────────────────────────────────────────────
let SESSION      = null;
let STATE        = {};      // canvas-state.json pixels
let placements   = [];
let color        = PALETTE[0];
let credits      = 0;
let gistId       = null;
let expiresAt    = null;
let W = 64, H = 64;

const PS = 8; // pixel size on canvas element (before CSS scale)
let scale   = 1;
let ox = 0, oy = 0;  // offset

// pan tracking
let panning  = false;
let panSX    = 0, panSY = 0;
let panMoved = false;

// pinch
let lastPinch = 0;

// ── DOM ────────────────────────────────────────────────────────────────────────
const cvs        = document.getElementById('cvs');
const ctx        = cvs.getContext('2d');
const area       = document.getElementById('canvasArea');
const colorBar   = document.getElementById('colorBar');
const selColor   = document.getElementById('selColor');
const creditsEl  = document.getElementById('creditsLeft');
const placedEl   = document.getElementById('placedCount');
const timerEl    = document.getElementById('timerVal');
const saveCount  = document.getElementById('saveCount');
const btnSave    = document.getElementById('btnSave');
const btnUndo    = document.getElementById('btnUndo');
const coordTip   = document.getElementById('coordTip');
const toast      = document.getElementById('toast');
const loadScreen = document.getElementById('loadScreen');
const doneScreen = document.getElementById('doneScreen');

// ── Boot ───────────────────────────────────────────────────────────────────────
(async () => {
  const p = new URLSearchParams(location.search);
  gistId  = p.get('gist');

  if (!gistId) {
    setLoad('No session found.');
    showToast('Use /pixel-place in Discord to get a link.', 'error', 0);
    loadScreen.style.display = 'none';
    return;
  }

  try {
    setLoad('Reading session…');
    SESSION = await getGist(gistId, 'pixel-session.json');

    if (SESSION.status !== 'active') {
      setLoad('Session expired or already submitted.');
      setTimeout(() => loadScreen.style.display = 'none', 1500);
      return;
    }

    credits   = SESSION.credits;
    expiresAt = SESSION.expiresAt;
    W         = SESSION.canvasWidth  || 64;
    H         = SESSION.canvasHeight || 64;

    setLoad('Loading canvas…');
    const raw = await getGist(SESSION.canvasStateGist, 'canvas-state.json');
    STATE     = raw.pixels || {};

    buildPalette();
    initCanvas();
    draw();
    updateUI();
    startTimer();

    loadScreen.style.display = 'none';
    showToast(`${credits} pixel${credits !== 1 ? 's' : ''} available — tap to place!`, 'ok');
  } catch (e) {
    console.error(e);
    setLoad('Failed to load: ' + e.message);
    setTimeout(() => loadScreen.style.display = 'none', 2500);
  }
})();

// ── Gist ───────────────────────────────────────────────────────────────────────
async function getGist(id, file) {
  const r = await fetch(`https://api.github.com/gists/${id}`, {
    headers: { Accept: 'application/vnd.github+json' }
  });
  if (!r.ok) throw new Error(`Gist fetch ${r.status}`);
  const d = await r.json();
  const c = d.files?.[file]?.content;
  if (!c) throw new Error(`${file} not in Gist`);
  return JSON.parse(c);
}

async function patchGist(id, file, data) {
  const r = await fetch(`https://basicworld.vercel.app/api/gist?id=${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename: file, content: JSON.stringify(data) })
  });
  if (!r.ok) throw new Error(`Patch failed ${r.status}`);
}

// ── Canvas ─────────────────────────────────────────────────────────────────────
function initCanvas() {
  cvs.width  = W * PS;
  cvs.height = H * PS;
  fitView();
}

function fitView() {
  const r   = area.getBoundingClientRect();
  const fit = Math.min(r.width / cvs.width, r.height / cvs.height, 2) * 0.95;
  scale = fit;
  ox    = (r.width  - cvs.width  * scale) / 2;
  oy    = (r.height - cvs.height * scale) / 2;
  applyXY();
}

function applyXY() {
  cvs.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
}

function draw() {
  const now = Date.now();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      const k  = `${x},${y}`;
      const st = STATE[k];
      const pn = placements.find(p => p.x === x && p.y === y);

      ctx.fillStyle = pn ? pn.color : (st?.color || '#FFFFFF');
      ctx.fillRect(x * PS, y * PS, PS, PS);

      if (st?.protectedUntil > now && !pn) {
        ctx.fillStyle = 'rgba(100,180,255,0.3)';
        ctx.fillRect(x * PS, y * PS, PS, PS);
      }

      if (pn) {
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth   = 1.5;
        ctx.strokeRect(x * PS + 1, y * PS + 1, PS - 2, PS - 2);
      }
    }
  }

  // grid
  ctx.strokeStyle = 'rgba(0,0,0,0.09)';
  ctx.lineWidth   = 0.5;
  for (let i = 0; i <= W; i++) {
    ctx.beginPath(); ctx.moveTo(i*PS,0); ctx.lineTo(i*PS,H*PS); ctx.stroke();
  }
  for (let i = 0; i <= H; i++) {
    ctx.beginPath(); ctx.moveTo(0,i*PS); ctx.lineTo(W*PS,i*PS); ctx.stroke();
  }
}

// ── Coord from pointer ─────────────────────────────────────────────────────────
function pxCoord(cx, cy) {
  const r = area.getBoundingClientRect();
  return {
    x: Math.floor((cx - r.left - ox) / (PS * scale)),
    y: Math.floor((cy - r.top  - oy) / (PS * scale)),
  };
}

// ── Place pixel ────────────────────────────────────────────────────────────────
function place(cx, cy) {
  const { x, y } = pxCoord(cx, cy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;

  const st  = STATE[`${x},${y}`];
  const idx = placements.findIndex(p => p.x === x && p.y === y);

  if (idx !== -1) {
    // re-color
    placements[idx].color = color;
    draw(); updateUI();
    showToast(`(${x},${y}) recolored`, 'ok');
    return;
  }

  if (st?.protectedUntil > Date.now()) {
    const m = Math.ceil((st.protectedUntil - Date.now()) / 60000);
    showToast(`Protected ~${m} min. Try another spot.`, 'warn');
    return;
  }

  if (placements.length >= credits) {
    showToast('No credits left — save or undo a pixel.', 'warn');
    return;
  }

  placements.push({ x, y, color });
  draw(); updateUI();
  showToast(`Placed at (${x},${y})`, 'ok');
}

// ── Mouse ──────────────────────────────────────────────────────────────────────
area.addEventListener('mousedown', e => {
  panning  = true;
  panMoved = false;
  panSX    = e.clientX - ox;
  panSY    = e.clientY - oy;
});

area.addEventListener('mousemove', e => {
  if (panning) {
    const dx = Math.abs(e.clientX - (panSX + ox));
    const dy = Math.abs(e.clientY - (panSY + oy));
    if (dx > 3 || dy > 3) panMoved = true;
    ox = e.clientX - panSX;
    oy = e.clientY - panSY;
    applyXY();
  }
  const { x, y } = pxCoord(e.clientX, e.clientY);
  if (x >= 0 && x < W && y >= 0 && y < H) {
    coordTip.textContent   = `(${x},${y})`;
    coordTip.style.display = 'block';
  } else {
    coordTip.style.display = 'none';
  }
});

area.addEventListener('mouseup', e => {
  panning = false;
  if (!panMoved) place(e.clientX, e.clientY);
});

area.addEventListener('mouseleave', () => {
  panning = false;
  coordTip.style.display = 'none';
});

area.addEventListener('wheel', e => {
  e.preventDefault();
  const d  = e.deltaY > 0 ? 0.9 : 1.1;
  const r  = area.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  const ns = Math.max(.4, Math.min(12, scale * d));
  ox = mx - (mx - ox) * (ns / scale);
  oy = my - (my - oy) * (ns / scale);
  scale = ns;
  applyXY();
}, { passive: false });

// ── Touch ──────────────────────────────────────────────────────────────────────
let tStart = null, tMoved = false;

area.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    tStart  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    tMoved  = false;
    panSX   = e.touches[0].clientX - ox;
    panSY   = e.touches[0].clientY - oy;
    lastPinch = 0;
  } else if (e.touches.length === 2) {
    lastPinch = pinchDist(e.touches);
  }
}, { passive: false });

area.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const d  = pinchDist(e.touches);
    if (lastPinch) {
      const r  = area.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      const ns = Math.max(.4, Math.min(12, scale * d / lastPinch));
      ox = mx - (mx - ox) * (ns / scale);
      oy = my - (my - oy) * (ns / scale);
      scale = ns;
      applyXY();
    }
    lastPinch = d;
  } else if (e.touches.length === 1 && tStart) {
    const dx = Math.abs(e.touches[0].clientX - tStart.x);
    const dy = Math.abs(e.touches[0].clientY - tStart.y);
    if (dx > 5 || dy > 5) tMoved = true;
    ox = e.touches[0].clientX - panSX;
    oy = e.touches[0].clientY - panSY;
    applyXY();
  }
}, { passive: false });

area.addEventListener('touchend', e => {
  e.preventDefault();
  if (!tMoved && e.changedTouches.length === 1) {
    place(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
  lastPinch = 0;
}, { passive: false });

function pinchDist(t) {
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

// ── Palette ────────────────────────────────────────────────────────────────────
function buildPalette() {
  // remove old swatches (keep the label)
  colorBar.querySelectorAll('.swatch').forEach(s => s.remove());
  PALETTE.forEach(hex => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (hex === color ? ' selected' : '');
    sw.style.background = hex;
    sw.addEventListener('click', () => {
      color = hex;
      colorBar.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      selColor.style.background = hex;
    });
    colorBar.appendChild(sw);
  });
  selColor.style.background = color;
}

// ── UI ─────────────────────────────────────────────────────────────────────────
function updateUI() {
  creditsEl.textContent = credits - placements.length;
  placedEl.textContent  = placements.length;
  saveCount.textContent = placements.length;
  btnSave.disabled  = placements.length === 0;
  btnUndo.disabled  = placements.length === 0;
}

// ── Timer ──────────────────────────────────────────────────────────────────────
function startTimer() {
  function tick() {
    const ms = expiresAt - Date.now();
    if (ms <= 0) {
      timerEl.textContent = 'Expired';
      timerEl.className   = 'pill-val r';
      showToast('Session expired — pixel balance unchanged. Use /pixel-place again.', 'error', 0);
      btnSave.disabled = true;
      return;
    }
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    timerEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
    timerEl.className   = `pill-val ${m < 5 ? 'r' : 'c'}`;
    setTimeout(tick, 1000);
  }
  tick();
}

// ── Zoom buttons ───────────────────────────────────────────────────────────────
function doZoom(f) {
  const r  = area.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const ns = Math.max(.4, Math.min(12, scale * f));
  ox = cx - (cx - ox) * (ns / scale);
  oy = cy - (cy - oy) * (ns / scale);
  scale = ns;
  applyXY();
}
document.getElementById('zIn').addEventListener('click',    () => doZoom(1.3));
document.getElementById('zOut').addEventListener('click',   () => doZoom(0.77));
document.getElementById('zReset').addEventListener('click', () => fitView());

// ── Undo ───────────────────────────────────────────────────────────────────────
btnUndo.addEventListener('click', () => {
  if (!placements.length) return;
  placements.pop();
  draw(); updateUI();
});

// ── Save ───────────────────────────────────────────────────────────────────────
btnSave.addEventListener('click', async () => {
  if (!placements.length) return;
  btnSave.disabled    = true;
  btnSave.textContent = 'Saving…';

  try {
    await patchGist(gistId, 'pixel-session.json', { ...SESSION, placements, status: 'submitted' });
    doneScreen.style.display = 'flex';
  } catch (e) {
    console.error(e);
    showToast('Save failed: ' + e.message, 'error');
    btnSave.disabled  = false;
    btnSave.innerHTML = `✅ Save &amp; Return <span class="save-count">${placements.length}</span>`;
  }
});

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTmr = null;
function showToast(msg, type = '', dur = 2800) {
  toast.textContent = msg;
  toast.className   = `toast ${type} show`;
  clearTimeout(toastTmr);
  if (dur > 0) toastTmr = setTimeout(() => toast.classList.remove('show'), dur);
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function setLoad(t) { document.getElementById('loadText').textContent = t; }
</script>
