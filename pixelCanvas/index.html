<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BASIC x DONKEY — Pixel Canvas</title>
<style>
  :root {
    --yellow:   #FFE033;
    --yellow2:  #FFB800;
    --black:    #0E0E0E;
    --offblack: #181818;
    --panel:    #1E1E1E;
    --border:   #2E2E2E;
    --border2:  #3D3D3D;
    --white:    #F5F5F0;
    --muted:    #6A6A6A;
    --green:    #3DDB6F;
    --red:      #FF4D4D;
    --orange:   #FF8C00;
    --blue:     #5b9fff;
    --pixel:    'Press Start 2P', monospace;
    --mono:     'DM Mono', monospace;
    --sans:     'DM Sans', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: var(--sans);
    overflow: hidden;
    /* touch-action on body intentionally NOT set to none —
       we handle it per-element so buttons get real tap events */
    user-select: none;
    -webkit-user-select: none;
  }

  .shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100vw;
  }

  /* ─── Top bar ─────────────────────────────────────────────────────── */
  .top-bar {
    flex-shrink: 0;
    height: 48px;
    background: var(--yellow);
    border-bottom: 3px solid var(--black);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
    z-index: 10;
    position: relative;
    overflow: hidden;
    touch-action: none;
  }

  .top-bar::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 8px 8px;
    pointer-events: none;
  }

  .top-title {
    font-family: var(--pixel);
    font-size: 7px;
    color: var(--black);
    letter-spacing: .04em;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }

  .top-spacer { flex: 1; }

  .pill {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--black);
    padding: 4px 7px;
    font-family: var(--pixel);
    font-size: 6px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
    color: var(--white);
    white-space: nowrap;
  }

  .pill-val        { font-weight: 700; color: var(--yellow); }
  .pill-val.placed { color: var(--white); }
  .pill-val.r      { color: var(--red); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:.3; } }

  /* ─── Canvas area ─────────────────────────────────────────────────── */
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--offblack);
    cursor: crosshair;
    /* touch-action none here so we get all touch events on the canvas */
    touch-action: none;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    transform-origin: 0 0;
    /* Prevent canvas from being a tap target for default behaviors */
    touch-action: none;
  }

  .coord-tip {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--black);
    border: 1px solid var(--yellow);
    padding: 3px 8px;
    font-family: var(--pixel);
    font-size: 7px;
    color: var(--yellow);
    pointer-events: none;
    display: none;
    z-index: 5;
  }

  /* Zoom buttons — larger on mobile, explicit touch-action auto so taps work */
  .zoom-btns {
    position: absolute;
    top: 8px; left: 8px;
    display: flex;
    gap: 6px;
    z-index: 20;
    /* CRITICAL: touch-action auto lets these receive normal tap events
       even though the parent canvas-area has touch-action: none */
    touch-action: auto;
  }

  .zoom-btn {
    width: 44px; height: 44px;
    border: 2px solid var(--border2);
    background: rgba(14,14,14,.92);
    color: var(--white);
    font-family: var(--pixel);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Each button handles its own touch */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    border-radius: 2px;
  }
  .zoom-btn:active { background: var(--yellow); color: var(--black); }

  /* ─── Color bar ───────────────────────────────────────────────────── */
  .color-bar {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 2px solid var(--border);
    padding: 7px 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    /* allow horizontal scroll on color bar */
    touch-action: pan-x;
  }
  .color-bar::-webkit-scrollbar { display: none; }

  .color-label {
    font-family: var(--pixel);
    font-size: 6px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    flex-shrink: 0;
  }

  .swatch {
    /* Larger hit target on mobile */
    width: 32px; height: 32px;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid transparent;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .swatch:active   { opacity: .7; transform: scale(.88); }
  .swatch.selected { border-color: var(--yellow); }

  /* ─── Action bar ──────────────────────────────────────────────────── */
  .action-bar {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 3px solid var(--black);
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    /* buttons need normal touch handling */
    touch-action: manipulation;
  }

  .sel-color {
    width: 40px; height: 40px;
    border: 2px solid var(--border2);
    flex-shrink: 0;
  }

  .undo-btn {
    height: 40px;
    padding: 0 12px;
    border: 2px solid var(--border2);
    background: transparent;
    color: var(--muted);
    font-family: var(--pixel);
    font-size: 7px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: .06em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .undo-btn:active:not(:disabled) { opacity: .6; }
  .undo-btn:disabled { opacity: .3; cursor: not-allowed; }

  .save-btn {
    flex: 1;
    height: 48px;
    border: none;
    background: var(--yellow);
    color: var(--black);
    font-family: var(--pixel);
    font-size: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .1s;
    letter-spacing: .06em;
    min-width: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .save-btn:active:not(:disabled) { background: var(--yellow2); }
  .save-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  .save-btn.success { background: var(--green) !important; color: var(--black) !important; }

  .save-count {
    background: rgba(0,0,0,0.2);
    padding: 2px 7px;
    font-size: 7px;
  }
  .save-btn:disabled .save-count { background: var(--border2); color: var(--muted); }

  /* ─── Toast ───────────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--offblack);
    border: 2px solid var(--border2);
    border-left: 3px solid var(--yellow);
    padding: 8px 14px;
    font-family: var(--pixel);
    font-size: 7px;
    color: var(--white);
    letter-spacing: .06em;
    z-index: 50;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    white-space: nowrap;
    max-width: 88vw;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show  { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.warn  { border-left-color: var(--orange); color: var(--orange); }
  .toast.error { border-left-color: var(--red);    color: var(--red); }
  .toast.ok    { border-left-color: var(--green);  color: var(--green); }

  /* ─── Screens ─────────────────────────────────────────────────────── */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 24px;
    background: var(--black);
  }

  .pixel-loader {
    display: grid;
    grid-template-columns: repeat(5, 10px);
    grid-template-rows: repeat(5, 10px);
    gap: 3px;
  }

  .pixel-loader div {
    background: var(--border);
    animation: pixelblink 1s steps(1) infinite;
  }
  .pixel-loader div:nth-child(odd)  { animation-delay: 0s; }
  .pixel-loader div:nth-child(even) { animation-delay: .5s; }

  @keyframes pixelblink {
    0%, 49%  { background: var(--yellow); }
    50%, 100% { background: var(--border); }
  }

  .screen-text {
    font-family: var(--pixel);
    font-size: 8px;
    color: var(--muted);
    letter-spacing: .12em;
  }

  #doneScreen { background: rgba(14,14,14,.97); display: none; }

  .done-icon  { font-size: 52px; animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }

  .done-title {
    font-family: var(--pixel);
    font-size: 12px;
    color: var(--yellow);
    line-height: 1.8;
    letter-spacing: .06em;
  }

  .done-sub {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    max-width: 300px;
    line-height: 1.7;
  }
  .done-sub b { color: var(--white); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="screen" id="loadScreen">
  <div class="pixel-loader">
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
  </div>
  <div class="screen-text" id="loadText">Loading session…</div>
</div>

<div class="screen" id="doneScreen">
  <div class="done-icon">✅</div>
  <div class="done-title">Pixels<br>Placed!</div>
  <div class="done-sub" id="doneSubText">Your pixels have been placed on the canvas!</div>
</div>

<div class="toast" id="toast"></div>

<div class="shell">

  <div class="top-bar">
    <div class="top-title">B×D CANVAS</div>
    <div class="top-spacer"></div>
    <div class="pill">Left <span class="pill-val" id="creditsLeft">—</span></div>
    <div class="pill">Placed <span class="pill-val placed" id="placedCount">0</span></div>
    <div class="pill">⏱ <span class="pill-val" id="timerVal">—</span></div>
  </div>

  <div class="canvas-area" id="canvasArea">
    <canvas id="cvs"></canvas>
    <div class="coord-tip" id="coordTip"></div>
    <div class="zoom-btns">
      <button class="zoom-btn" id="zIn"    type="button">+</button>
      <button class="zoom-btn" id="zOut"   type="button">−</button>
      <button class="zoom-btn" id="zReset" type="button" style="font-size:13px">⊡</button>
    </div>
  </div>

  <div class="color-bar" id="colorBar">
    <span class="color-label">Color →</span>
  </div>

  <div class="action-bar">
    <div class="sel-color" id="selColor"></div>
    <button class="undo-btn" id="btnUndo" type="button" disabled>↩ Undo</button>
    <button class="save-btn" id="btnSave" type="button" disabled>
      Save &amp; Place
      <span class="save-count" id="saveCount">0</span>
    </button>
  </div>

</div>

<script>
// ── Palette ────────────────────────────────────────────────────────────────────
const PALETTE = [
  '#FF0000','#FF4500','#FF8800','#FFD700','#FFFF00','#AAFF00',
  '#00FF00','#00FF88','#00FFFF','#00AAFF','#0055FF','#0000FF',
  '#8800FF','#CC00FF','#FF00FF','#FF0088','#FF69B4','#FF99AA',
  '#FFFFFF','#DDDDDD','#AAAAAA','#777777','#444444','#000000',
  '#8B4513','#A0522D','#D2691E','#F4A460','#DEB887','#FFDEAD',
  '#228B22','#2E8B57','#20B2AA','#4169E1','#7B2FBE','#DC143C',
];

// ── State ──────────────────────────────────────────────────────────────────────
let SESSION     = null;
let STATE       = {};
let placements  = [];
let color       = PALETTE[0];
let credits     = 0;
let gistId      = null;
let expiresAt   = null;
let algoAddress = null;
let W = 64, H = 64;

// Canvas transform
const PS = 8;
let scale = 1, ox = 0, oy = 0;

// ── DOM ────────────────────────────────────────────────────────────────────────
const cvs         = document.getElementById('cvs');
const ctx         = cvs.getContext('2d');
const area        = document.getElementById('canvasArea');
const colorBar    = document.getElementById('colorBar');
const selColor    = document.getElementById('selColor');
const creditsEl   = document.getElementById('creditsLeft');
const placedEl    = document.getElementById('placedCount');
const timerEl     = document.getElementById('timerVal');
const saveCount   = document.getElementById('saveCount');
const btnSave     = document.getElementById('btnSave');
const btnUndo     = document.getElementById('btnUndo');
const coordTip    = document.getElementById('coordTip');
const toast       = document.getElementById('toast');
const loadScreen  = document.getElementById('loadScreen');
const doneScreen  = document.getElementById('doneScreen');
const doneSubText = document.getElementById('doneSubText');

// ── Boot ───────────────────────────────────────────────────────────────────────
(async () => {
  const p = new URLSearchParams(location.search);
  gistId      = p.get('gist');
  algoAddress = p.get('address') || null;

  if (!gistId) {
    setLoad('No session found.');
    showToast('Open this page from Discord or the web app.', 'error', 0);
    loadScreen.style.display = 'none';
    return;
  }

  try {
    setLoad('Reading session…');
    SESSION = await getGist(gistId, 'pixel-session.json');

    if (SESSION.status !== 'active') {
      setLoad('Session expired or already submitted.');
      setTimeout(() => loadScreen.style.display = 'none', 1500);
      return;
    }

    if (!algoAddress) algoAddress = SESSION.algoAddress || null;

    if (!algoAddress) {
      setLoad('No wallet address found in session.');
      showToast('Session is missing wallet address. Please try again.', 'error', 0);
      loadScreen.style.display = 'none';
      return;
    }

    credits   = SESSION.credits;
    expiresAt = SESSION.expiresAt;
    W         = SESSION.canvasWidth  || 64;
    H         = SESSION.canvasHeight || 64;

    setLoad('Loading canvas…');
    const raw = await getGist(SESSION.canvasStateGist, 'canvas-state.json');
    STATE     = raw.pixels || {};

    buildPalette();
    initCanvas();
    draw();
    updateUI();
    startTimer();

    loadScreen.style.display = 'none';
    requestAnimationFrame(() => fitView());
    showToast(`${credits} pixel${credits !== 1 ? 's' : ''} — tap to place!`, 'ok');
  } catch (e) {
    console.error(e);
    setLoad('Failed to load: ' + e.message);
    setTimeout(() => loadScreen.style.display = 'none', 2500);
  }
})();

// ── Gist ───────────────────────────────────────────────────────────────────────
async function getGist(id, file) {
  const r = await fetch(`https://api.github.com/gists/${id}`, {
    headers: { Accept: 'application/vnd.github+json' }
  });
  if (!r.ok) throw new Error(`Gist fetch ${r.status}`);
  const d = await r.json();
  const c = d.files?.[file]?.content;
  if (!c) throw new Error(`${file} not in Gist`);
  return JSON.parse(c);
}

async function patchGist(id, file, data) {
  const r = await fetch(`https://basicworld.vercel.app/api/gist?id=${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename: file, content: JSON.stringify(data) })
  });
  if (!r.ok) throw new Error(`Patch failed ${r.status}`);
}

// ── Canvas ─────────────────────────────────────────────────────────────────────
function initCanvas() {
  cvs.width  = W * PS;
  cvs.height = H * PS;
}

function fitView() {
  const r   = area.getBoundingClientRect();
  const fit = Math.min(r.width / cvs.width, r.height / cvs.height, 2) * 0.92;
  scale = fit;
  ox    = (r.width  - cvs.width  * scale) / 2;
  oy    = (r.height - cvs.height * scale) / 2;
  applyXY();
}

function applyXY() {
  cvs.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
}

function draw() {
  const now = Date.now();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, cvs.width, cvs.height);

  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      const k  = `${x},${y}`;
      const st = STATE[k];
      const pn = placements.find(p => p.x === x && p.y === y);

      ctx.fillStyle = pn ? pn.color : (st?.color || '#FFFFFF');
      ctx.fillRect(x * PS, y * PS, PS, PS);

      if (st?.protectedUntil > now && !pn) {
        ctx.fillStyle = 'rgba(91,159,255,0.28)';
        ctx.fillRect(x * PS, y * PS, PS, PS);
      }

      if (pn) {
        ctx.strokeStyle = 'rgba(255,224,51,0.85)';
        ctx.lineWidth   = 1.5;
        ctx.strokeRect(x * PS + 1, y * PS + 1, PS - 2, PS - 2);
      }
    }
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.09)';
  ctx.lineWidth   = 0.5;
  for (let i = 0; i <= W; i++) {
    ctx.beginPath(); ctx.moveTo(i*PS,0); ctx.lineTo(i*PS,H*PS); ctx.stroke();
  }
  for (let i = 0; i <= H; i++) {
    ctx.beginPath(); ctx.moveTo(0,i*PS); ctx.lineTo(W*PS,i*PS); ctx.stroke();
  }
}

// ── Coord helper ───────────────────────────────────────────────────────────────
function pxCoord(cx, cy) {
  const r = area.getBoundingClientRect();
  return {
    x: Math.floor((cx - r.left - ox) / (PS * scale)),
    y: Math.floor((cy - r.top  - oy) / (PS * scale)),
  };
}

// ── Place pixel ────────────────────────────────────────────────────────────────
function place(cx, cy) {
  const { x, y } = pxCoord(cx, cy);
  if (x < 0 || x >= W || y < 0 || y >= H) return;

  const st  = STATE[`${x},${y}`];
  const idx = placements.findIndex(p => p.x === x && p.y === y);

  if (idx !== -1) {
    placements[idx].color = color;
    draw(); updateUI();
    showToast(`(${x},${y}) recolored`, 'ok');
    return;
  }

  if (st?.protectedUntil > Date.now()) {
    const m = Math.ceil((st.protectedUntil - Date.now()) / 60000);
    showToast(`Protected ~${m} min`, 'warn');
    return;
  }

  if (placements.length >= credits) {
    showToast('No credits left — save or undo', 'warn');
    return;
  }

  placements.push({ x, y, color });
  draw(); updateUI();
  showToast(`(${x},${y}) placed`, 'ok');
}

// ── Mouse (desktop) ────────────────────────────────────────────────────────────
let mouseDown = false, mouseMoved = false, mouseSX = 0, mouseSY = 0;

area.addEventListener('mousedown', e => {
  if (e.target.closest('.zoom-btns')) return;
  mouseDown  = true;
  mouseMoved = false;
  mouseSX    = e.clientX - ox;
  mouseSY    = e.clientY - oy;
});

area.addEventListener('mousemove', e => {
  if (mouseDown) {
    const dx = Math.abs(e.clientX - (mouseSX + ox));
    const dy = Math.abs(e.clientY - (mouseSY + oy));
    if (dx > 3 || dy > 3) mouseMoved = true;
    ox = e.clientX - mouseSX;
    oy = e.clientY - mouseSY;
    applyXY();
  }
  const { x, y } = pxCoord(e.clientX, e.clientY);
  if (x >= 0 && x < W && y >= 0 && y < H) {
    const pixel = STATE[`${x},${y}`];
    coordTip.textContent   = pixel?.ownerName ? `(${x},${y}) · ${pixel.ownerName}` : `(${x},${y})`;
    coordTip.style.display = 'block';
  } else {
    coordTip.style.display = 'none';
  }
});

area.addEventListener('mouseup', e => {
  if (e.target.closest('.zoom-btns')) return;
  if (!mouseMoved) place(e.clientX, e.clientY);
  mouseDown = false;
});

area.addEventListener('mouseleave', () => {
  mouseDown = false;
  coordTip.style.display = 'none';
});

area.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const r  = area.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  const ns = Math.max(.3, Math.min(14, scale * factor));
  ox = mx - (mx - ox) * (ns / scale);
  oy = my - (my - oy) * (ns / scale);
  scale = ns; applyXY();
}, { passive: false });

// ── Touch (mobile) — completely rewritten ──────────────────────────────────────
//
// Key fixes:
//   1. Zoom buttons use click events, not touch events on the canvas
//   2. Single finger: pan only. Tap = touchstart + touchend with < 8px movement
//   3. Two finger: pinch zoom with mid-point anchor — no jitter
//   4. Finger count changes (going from 2 to 1) resets pan origin cleanly
//   5. tap threshold raised to 10px to reduce accidental pans on mobile

let touchState = 'idle'; // 'idle' | 'tap' | 'pan' | 'pinch'
let tapStart   = null;   // { x, y } of first touch
let panOriginX = 0, panOriginY = 0; // ox/oy when pan started
let panStartX  = 0, panStartY  = 0; // finger position when pan started
let lastPinchDist   = 0;
let lastPinchMidX   = 0;
let lastPinchMidY   = 0;
let lastPinchOx     = 0;
let lastPinchOy     = 0;
let lastPinchScale  = 0;

const TAP_THRESHOLD = 10; // px — must move less than this to count as a tap

area.addEventListener('touchstart', e => {
  e.preventDefault();

  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchState   = 'tap';
    tapStart     = { x: t.clientX, y: t.clientY };
    panOriginX   = ox;
    panOriginY   = oy;
    panStartX    = t.clientX;
    panStartY    = t.clientY;
  } else if (e.touches.length === 2) {
    touchState = 'pinch';
    const t0 = e.touches[0], t1 = e.touches[1];
    lastPinchDist  = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    lastPinchMidX  = (t0.clientX + t1.clientX) / 2;
    lastPinchMidY  = (t0.clientY + t1.clientY) / 2;
    lastPinchOx    = ox;
    lastPinchOy    = oy;
    lastPinchScale = scale;
  }
}, { passive: false });

area.addEventListener('touchmove', e => {
  e.preventDefault();

  if (e.touches.length === 2) {
    // Always switch to pinch on two fingers
    if (touchState !== 'pinch') {
      touchState = 'pinch';
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist  = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchMidX  = (t0.clientX + t1.clientX) / 2;
      lastPinchMidY  = (t0.clientY + t1.clientY) / 2;
      lastPinchOx    = ox;
      lastPinchOy    = oy;
      lastPinchScale = scale;
    }

    const t0 = e.touches[0], t1 = e.touches[1];
    const dist  = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const midX  = (t0.clientX + t1.clientX) / 2;
    const midY  = (t0.clientY + t1.clientY) / 2;
    const r     = area.getBoundingClientRect();

    // Scale relative to initial pinch state for smoother feel
    const scaleFactor = dist / lastPinchDist;
    const ns = Math.max(.3, Math.min(14, lastPinchScale * scaleFactor));

    // Anchor zoom to midpoint of initial pinch
    const anchorX = lastPinchMidX - r.left;
    const anchorY = lastPinchMidY - r.top;
    const panDX   = midX - lastPinchMidX;
    const panDY   = midY - lastPinchMidY;

    ox = anchorX - (anchorX - lastPinchOx) * (ns / lastPinchScale) + panDX;
    oy = anchorY - (anchorY - lastPinchOy) * (ns / lastPinchScale) + panDY;
    scale = ns;
    applyXY();

  } else if (e.touches.length === 1) {
    const t  = e.touches[0];
    const dx = t.clientX - panStartX;
    const dy = t.clientY - panStartY;

    // Only switch to pan if moved beyond tap threshold
    if (touchState === 'tap') {
      if (Math.abs(dx) > TAP_THRESHOLD || Math.abs(dy) > TAP_THRESHOLD) {
        touchState = 'pan';
      } else {
        return; // still within tap threshold, don't pan yet
      }
    }

    if (touchState === 'pan') {
      ox = panOriginX + dx;
      oy = panOriginY + dy;
      applyXY();
    }
  }
}, { passive: false });

area.addEventListener('touchend', e => {
  e.preventDefault();

  if (touchState === 'tap' && e.changedTouches.length === 1) {
    const t  = e.changedTouches[0];
    const dx = Math.abs(t.clientX - tapStart.x);
    const dy = Math.abs(t.clientY - tapStart.y);
    if (dx < TAP_THRESHOLD && dy < TAP_THRESHOLD) {
      place(t.clientX, t.clientY);
    }
  }

  // If going from 2 fingers back to 1, reset pan state to avoid jump
  if (e.touches.length === 1 && touchState === 'pinch') {
    touchState  = 'pan';
    const t     = e.touches[0];
    panStartX   = t.clientX;
    panStartY   = t.clientY;
    panOriginX  = ox;
    panOriginY  = oy;
    return;
  }

  if (e.touches.length === 0) {
    touchState = 'idle';
  }
}, { passive: false });

// ── Zoom buttons — use click for both desktop and mobile ───────────────────────
// Using click instead of touchstart means the button's touch-action:manipulation
// handles the tap natively and we don't fight with the canvas touch handler.

function doZoom(factor) {
  const r  = area.getBoundingClientRect();
  const cx = r.width  / 2;
  const cy = r.height / 2;
  const ns = Math.max(.3, Math.min(14, scale * factor));
  ox = cx - (cx - ox) * (ns / scale);
  oy = cy - (cy - oy) * (ns / scale);
  scale = ns;
  applyXY();
}

document.getElementById('zIn').addEventListener('click',    () => doZoom(1.35));
document.getElementById('zOut').addEventListener('click',   () => doZoom(0.74));
document.getElementById('zReset').addEventListener('click', () => fitView());

// ── Palette ────────────────────────────────────────────────────────────────────
function buildPalette() {
  colorBar.querySelectorAll('.swatch').forEach(s => s.remove());
  PALETTE.forEach(hex => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (hex === color ? ' selected' : '');
    sw.style.background = hex;
    sw.addEventListener('click', () => {
      color = hex;
      colorBar.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      selColor.style.background = hex;
    });
    colorBar.appendChild(sw);
  });
  selColor.style.background = color;
}

// ── UI ─────────────────────────────────────────────────────────────────────────
function updateUI() {
  creditsEl.textContent = credits - placements.length;
  placedEl.textContent  = placements.length;
  saveCount.textContent = placements.length;
  btnSave.disabled  = placements.length === 0;
  btnUndo.disabled  = placements.length === 0;
}

// ── Timer ──────────────────────────────────────────────────────────────────────
function startTimer() {
  function tick() {
    const ms = expiresAt - Date.now();
    if (ms <= 0) {
      timerEl.textContent = 'Expired';
      timerEl.className   = 'pill-val r';
      showToast('Session expired — pixel balance unchanged.', 'error', 0);
      btnSave.disabled = true;
      return;
    }
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    timerEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
    timerEl.className   = m < 5 ? 'pill-val r' : 'pill-val';
    setTimeout(tick, 1000);
  }
  tick();
}

// ── Undo ───────────────────────────────────────────────────────────────────────
btnUndo.addEventListener('click', () => {
  if (!placements.length) return;
  placements.pop();
  draw(); updateUI();
});

// ── Save & Place ───────────────────────────────────────────────────────────────
btnSave.addEventListener('click', async () => {
  if (!placements.length) return;
  if (!algoAddress) {
    showToast('No wallet address — cannot submit.', 'error');
    return;
  }

  btnSave.disabled    = true;
  btnSave.textContent = 'Saving…';

  try {
    await patchGist(gistId, 'pixel-session.json', { ...SESSION, placements, status: 'submitted' });

    btnSave.textContent = 'Placing pixels…';

    const res  = await fetch(`https://basicworld.vercel.app/api/session?action=submit`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ address: algoAddress, gistId }),
    });
    const data = await res.json();

    if (!data.success) throw new Error(data.error || 'Submission failed');

    const placed = data.results?.placed?.length  || 0;
    const prot   = data.results?.protected?.length || 0;

    let msg = `<b>${placed} pixel${placed !== 1 ? 's' : ''}</b> placed on the canvas!`;
    if (prot > 0) msg += `<br>${prot} protected — credits returned.`;
    msg += `<br>Remaining: <b>${data.newBalance} pixel${data.newBalance !== 1 ? 's' : ''}</b>`;
    msg += `<br><br>Taking you to the viewer…`;
    doneSubText.innerHTML = msg;

    doneScreen.style.display = 'flex';

    setTimeout(() => {
      window.location.href = 'https://basicquilt.github.io/puffin-swap-redirect/pixelCanvas/viewer.html';
    }, 2500);

  } catch (e) {
    console.error(e);
    showToast('Failed: ' + e.message, 'error');
    btnSave.disabled  = false;
    btnSave.innerHTML = `Save &amp; Place <span class="save-count">${placements.length}</span>`;
  }
});

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTmr = null;
function showToast(msg, type = '', dur = 2800) {
  toast.textContent = msg;
  toast.className   = `toast ${type} show`;
  clearTimeout(toastTmr);
  if (dur > 0) toastTmr = setTimeout(() => toast.classList.remove('show'), dur);
}

function setLoad(t) { document.getElementById('loadText').textContent = t; }
</script>
