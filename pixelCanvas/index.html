<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DDAO Pixel Canvas</title>
<style>
  :root {
    --bg:        #0d0d14;
    --surface:   #14141f;
    --surface2:  #1a1a28;
    --border:    #1e1e30;
    --purple:    #7b2fbe;
    --purple-lo: #3d1760;
    --purple-hi: #a855f7;
    --cyan:      #22d3ee;
    --text:      #e2e2f0;
    --muted:     #6b6b8a;
    --red:       #ef4444;
    --green:     #22c55e;
    --orange:    #f97316;
    --radius:    8px;
    --mono:      'JetBrains Mono', 'Fira Code', monospace;
    --sans:      'Inter', system-ui, sans-serif;
    --bar-h:     64px; /* bottom bar height */
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    touch-action: none;
  }

  /* ── Layout: full viewport split into header / canvas / bottom bar ── */
  .layout {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    width: 100vw;
  }

  /* ── Header ──────────────────────────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    flex-wrap: wrap;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--purple-hi);
    box-shadow: 0 0 10px var(--purple-hi);
    flex-shrink: 0;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.85); }
  }

  .logo-text {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .logo-text span { color: var(--purple-hi); }

  .header-stats {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
    flex-shrink: 0;
  }

  .hstat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
  }

  .hstat-label {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
  }

  .hstat-value {
    font-size: 14px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--text);
    line-height: 1;
  }

  .hstat-value.purple { color: var(--purple-hi); }
  .hstat-value.cyan   { color: var(--cyan); }
  .hstat-value.orange { color: var(--orange); }

  /* ── Canvas area ─────────────────────────────────────────────────── */
  .canvas-area {
    position: relative;
    overflow: hidden;
    background: #111118;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #pixelCanvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    /* Pan & zoom handled via transform */
    transform-origin: center center;
    transition: none;
  }

  /* Floating controls top-left */
  .float-controls {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 20;
  }

  .float-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(20,20,31,0.85);
    backdrop-filter: blur(8px);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
  }

  .float-btn:hover { border-color: var(--purple); background: rgba(123,47,190,0.2); }
  .float-btn:active { transform: scale(0.93); }

  /* Coord tooltip */
  .coord-tip {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(13,13,20,0.88);
    border: 1px solid var(--purple);
    border-radius: 5px;
    padding: 4px 9px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--cyan);
    pointer-events: none;
    display: none;
    z-index: 20;
  }

  /* ── Floating color picker ────────────────────────────────────────── */
  .color-panel {
    position: absolute;
    bottom: calc(var(--bar-h) + 12px);
    left: 12px;
    background: rgba(20,20,31,0.95);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 30;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  .color-panel.open { display: flex; }

  .palette {
    display: grid;
    grid-template-columns: repeat(6, 26px);
    gap: 4px;
  }

  .swatch {
    width: 26px; height: 26px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
  }

  .swatch:hover    { transform: scale(1.15); }
  .swatch.selected { border-color: #fff; box-shadow: 0 0 0 1px var(--purple-hi); }

  .color-preview {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }

  .color-swatch-lg {
    width: 24px; height: 24px;
    border-radius: 4px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .color-hex {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
  }

  /* ── Placements panel ────────────────────────────────────────────── */
  .placements-panel {
    position: absolute;
    bottom: calc(var(--bar-h) + 12px);
    right: 12px;
    width: 200px;
    background: rgba(20,20,31,0.95);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 30;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    max-height: 280px;
  }

  .placements-panel.open { display: flex; }

  .panel-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--mono);
  }

  .placements-list {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .placements-list::-webkit-scrollbar { width: 3px; }
  .placements-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .placement-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .placement-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .placement-undo {
    margin-left: auto;
    cursor: pointer;
    color: var(--red);
    font-size: 12px;
    opacity: 0.5;
  }

  .placement-undo:hover { opacity: 1; }

  .empty-list {
    font-size: 10px;
    color: var(--muted);
    font-style: italic;
    text-align: center;
    padding: 8px 0;
  }

  /* ── Bottom bar — ALWAYS VISIBLE, cannot be missed ───────────────── */
  .bottom-bar {
    height: var(--bar-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    z-index: 10;
    flex-shrink: 0;
  }

  /* Color button shows current color */
  .color-toggle {
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s;
    position: relative;
  }

  .color-toggle:hover { border-color: var(--purple-hi); }

  .color-toggle-label {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: var(--muted);
    font-family: var(--mono);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  /* Divider */
  .bar-div {
    width: 1px;
    height: 32px;
    background: var(--border);
    flex-shrink: 0;
  }

  /* Undo / list buttons */
  .bar-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    padding: 6px 10px;
    font-size: 16px;
    transition: border-color 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .bar-btn:hover { border-color: var(--purple); color: var(--text); }
  .bar-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .bar-btn-label {
    font-size: 8px;
    font-family: var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1;
  }

  /* Save button — big, green, right side, impossible to miss */
  .save-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #16a34a, var(--green));
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    padding: 0 20px;
    height: 44px;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(34,197,94,0.35);
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    letter-spacing: 0.02em;
  }

  .save-btn:hover:not(:disabled) {
    opacity: 0.9;
    box-shadow: 0 0 28px rgba(34,197,94,0.55);
  }

  .save-btn:active:not(:disabled) { transform: scale(0.97); }

  .save-btn:disabled {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }

  .save-badge {
    background: rgba(255,255,255,0.25);
    border-radius: 12px;
    padding: 1px 7px;
    font-size: 12px;
    font-weight: 700;
  }

  .save-btn:disabled .save-badge {
    background: var(--border);
    color: var(--muted);
  }

  /* ── Status toast ────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: calc(var(--bar-h) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20,20,31,0.96);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--text);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.warn  { border-color: var(--orange); color: var(--orange); }
  .toast.error { border-color: var(--red);    color: var(--red); }
  .toast.ok    { border-color: var(--green);  color: var(--green); }

  /* ── Loading ─────────────────────────────────────────────────────── */
  #loadScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--purple-hi);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .load-text {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* ── Done screen ─────────────────────────────────────────────────── */
  #doneScreen {
    position: fixed;
    inset: 0;
    background: rgba(13,13,20,0.97);
    z-index: 200;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 24px;
  }

  .done-icon {
    font-size: 60px;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .done-title { font-size: 26px; font-weight: 700; color: var(--green); }

  .done-sub {
    font-size: 15px;
    color: var(--muted);
    max-width: 340px;
    line-height: 1.7;
  }

  .done-sub strong { color: var(--text); }

  /* ── Timer pill ──────────────────────────────────────────────────── */
  .timer-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .timer-val { color: var(--cyan); font-weight: 600; }
  .timer-val.urgent { color: var(--red); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- Loading -->
<div id="loadScreen">
  <div class="spinner"></div>
  <div class="load-text" id="loadText">Loading session…</div>
</div>

<!-- Done -->
<div id="doneScreen">
  <div class="done-icon">✅</div>
  <div class="done-title">Pixels saved!</div>
  <div class="done-sub">Head back to Discord and hit <strong>Submit Pixels</strong> to place them on the canvas.</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Main layout -->
<div class="layout">

  <!-- Header -->
  <div class="header">
    <div class="logo-dot"></div>
    <div class="logo-text">DDAO <span>Canvas</span></div>
    <div class="header-stats">
      <div class="hstat">
        <div class="hstat-label">Credits</div>
        <div class="hstat-value purple" id="creditsLeft">—</div>
      </div>
      <div class="hstat">
        <div class="hstat-label">Placed</div>
        <div class="hstat-value cyan" id="placedCount">0</div>
      </div>
      <div class="timer-pill">
        ⏱ <span class="timer-val" id="timerVal">—</span>
      </div>
    </div>
  </div>

  <!-- Canvas area -->
  <div class="canvas-area" id="canvasArea">
    <canvas id="pixelCanvas"></canvas>

    <!-- Floating zoom controls -->
    <div class="float-controls">
      <button class="float-btn" id="btnZoomIn"  title="Zoom in">+</button>
      <button class="float-btn" id="btnZoomOut" title="Zoom out">−</button>
      <button class="float-btn" id="btnZoomReset" title="Reset view" style="font-size:13px;">⊡</button>
    </div>

    <!-- Coord tip -->
    <div class="coord-tip" id="coordTip"></div>

    <!-- Floating color picker -->
    <div class="color-panel" id="colorPanel">
      <div class="palette" id="palette"></div>
      <div class="color-preview">
        <div class="color-swatch-lg" id="colorSwatchLg"></div>
        <div class="color-hex" id="colorHex">#000000</div>
      </div>
    </div>

    <!-- Floating placements list -->
    <div class="placements-panel" id="placementsPanel">
      <div class="panel-title">Your placements</div>
      <div class="placements-list" id="placementsList">
        <div class="empty-list">No pixels placed yet.</div>
      </div>
    </div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">

    <!-- Color toggle -->
    <div style="position:relative;">
      <div class="color-toggle" id="colorToggle" title="Pick color"></div>
    </div>

    <div class="bar-div"></div>

    <!-- Undo -->
    <button class="bar-btn" id="btnUndo" disabled title="Undo last pixel">
      <span>↩</span>
      <span class="bar-btn-label">Undo</span>
    </button>

    <!-- Placements list toggle -->
    <button class="bar-btn" id="btnList" title="View placements">
      <span>☰</span>
      <span class="bar-btn-label">List</span>
    </button>

    <!-- Save — right side, always visible -->
    <button class="save-btn" id="btnSave" disabled>
      ✅ Save &amp; Return
      <span class="save-badge" id="saveBadge">0</span>
    </button>

  </div>
</div>

<script>
// ── Palette ────────────────────────────────────────────────────────────────────
const PALETTE = [
  '#000000','#FFFFFF','#FF0000','#00FF00','#0000FF','#FFFF00',
  '#FF00FF','#00FFFF','#FF8800','#8800FF','#FF0088','#00FF88',
  '#884400','#004488','#448800','#FF4444',
  '#44FF44','#4444FF','#FFAA44','#AA44FF',
  '#FF44AA','#44FFAA','#AAAAAA','#555555',
  '#FFD700','#C0C0C0','#8B4513','#228B22',
  '#4169E1','#DC143C','#FF69B4','#20B2AA',
  '#FF6347','#7FFFD4','#DDA0DD','#F0E68C',
];

// ── State ──────────────────────────────────────────────────────────────────────
let SESSION       = null;
let CANVAS_STATE  = {};
let placements    = [];
let selectedColor = PALETTE[0];
let credits       = 0;
let gistId        = null;
let expiresAt     = null;
let W = 64, H = 64;

// Pan/zoom state
const PIXEL_SIZE  = 8;
let scale         = 1;
let offsetX       = 0;
let offsetY       = 0;
let isPanning     = false;
let panStart      = { x: 0, y: 0 };
let lastPinchDist = null;

// ── DOM ────────────────────────────────────────────────────────────────────────
const canvas         = document.getElementById('pixelCanvas');
const ctx            = canvas.getContext('2d');
const canvasArea     = document.getElementById('canvasArea');
const loadScreen     = document.getElementById('loadScreen');
const doneScreen     = document.getElementById('doneScreen');
const colorPanel     = document.getElementById('colorPanel');
const placementsPanel = document.getElementById('placementsPanel');
const colorToggle    = document.getElementById('colorToggle');
const coordTip       = document.getElementById('coordTip');
const creditsEl      = document.getElementById('creditsLeft');
const placedEl       = document.getElementById('placedCount');
const timerEl        = document.getElementById('timerVal');
const saveBadge      = document.getElementById('saveBadge');
const btnSave        = document.getElementById('btnSave');
const btnUndo        = document.getElementById('btnUndo');
const btnList        = document.getElementById('btnList');
const btnZoomIn      = document.getElementById('btnZoomIn');
const btnZoomOut     = document.getElementById('btnZoomOut');
const btnZoomReset   = document.getElementById('btnZoomReset');
const paletteEl      = document.getElementById('palette');
const placementsList = document.getElementById('placementsList');

// ── Boot ───────────────────────────────────────────────────────────────────────
(async () => {
  const params = new URLSearchParams(location.search);
  gistId = params.get('gist');

  if (!gistId) {
    document.getElementById('loadText').textContent = 'No session found.';
    showToast('No session. Use /pixel-place in Discord.', 'error', 0);
    loadScreen.style.display = 'none'; // show blank layout
    return;
  }

  try {
    document.getElementById('loadText').textContent = 'Reading your session…';
    SESSION = await fetchGist(gistId, 'pixel-session.json');

    if (SESSION.status !== 'active') {
      document.getElementById('loadText').textContent = 'Session expired.';
      showToast('Session already submitted or expired. Use /pixel-place for a new one.', 'error', 0);
      setTimeout(() => loadScreen.style.display = 'none', 1500);
      return;
    }

    credits   = SESSION.credits;
    expiresAt = SESSION.expiresAt;
    W         = SESSION.canvasWidth  || 64;
    H         = SESSION.canvasHeight || 64;

    document.getElementById('loadText').textContent = 'Loading canvas…';
    const stateRaw = await fetchGist(SESSION.canvasStateGist, 'canvas-state.json');
    CANVAS_STATE   = stateRaw.pixels || {};

    buildPalette();
    initCanvas();
    drawCanvas();
    updateUI();
    startTimer();
    loadScreen.style.display = 'none';

    showToast(`${credits} pixel${credits !== 1 ? 's' : ''} to place — tap the canvas!`, 'ok');
  } catch (err) {
    console.error(err);
    document.getElementById('loadText').textContent = 'Failed to load.';
    showToast('Failed to load session: ' + err.message, 'error', 0);
    setTimeout(() => loadScreen.style.display = 'none', 2000);
  }
})();

// ── Gist ───────────────────────────────────────────────────────────────────────
async function fetchGist(id, filename) {
  const res = await fetch(`https://api.github.com/gists/${id}`, {
    headers: { 'Accept': 'application/vnd.github+json' }
  });
  if (!res.ok) throw new Error(`Gist fetch failed (${res.status})`);
  const data    = await res.json();
  const content = data.files?.[filename]?.content;
  if (!content) throw new Error(`${filename} not found in Gist`);
  return JSON.parse(content);
}

async function patchGist(id, filename, content) {
  // Points to your Vercel proxy function
  const res = await fetch(`https://basicworld.vercel.app/api/gist?id=${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename, content: JSON.stringify(content) })
  });
  if (!res.ok) throw new Error(`Gist patch failed (${res.status})`);
  return res.json();
}

// ── Canvas setup ───────────────────────────────────────────────────────────────
function initCanvas() {
  canvas.width  = W * PIXEL_SIZE;
  canvas.height = H * PIXEL_SIZE;
  resetView();
}

function resetView() {
  const area = canvasArea.getBoundingClientRect();
  const fitScale = Math.min(
    (area.width  * 0.95) / canvas.width,
    (area.height * 0.95) / canvas.height,
    2
  );
  scale   = fitScale;
  offsetX = (area.width  - canvas.width  * scale) / 2;
  offsetY = (area.height - canvas.height * scale) / 2;
  applyTransform();
}

function applyTransform() {
  canvas.style.transform      = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  canvas.style.transformOrigin = '0 0';
}

// ── Draw ───────────────────────────────────────────────────────────────────────
function drawCanvas() {
  const now = Date.now();
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      const key     = `${x},${y}`;
      const pixel   = CANVAS_STATE[key];
      const pending = placements.find(p => p.x === x && p.y === y);

      ctx.fillStyle = pending ? pending.color : (pixel?.color || '#FFFFFF');
      ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);

      if (pixel?.protectedUntil > now && !pending) {
        ctx.fillStyle = 'rgba(100,180,255,0.32)';
        ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
      }

      if (pending) {
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth   = 1.5;
        ctx.strokeRect(x * PIXEL_SIZE + 1, y * PIXEL_SIZE + 1, PIXEL_SIZE - 2, PIXEL_SIZE - 2);
      }
    }
  }

  // Grid
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth   = 0.5;
  for (let x = 0; x <= W; x++) {
    ctx.beginPath(); ctx.moveTo(x * PIXEL_SIZE, 0); ctx.lineTo(x * PIXEL_SIZE, H * PIXEL_SIZE); ctx.stroke();
  }
  for (let y = 0; y <= H; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * PIXEL_SIZE); ctx.lineTo(W * PIXEL_SIZE, y * PIXEL_SIZE); ctx.stroke();
  }
}

// ── Coords from event ──────────────────────────────────────────────────────────
function getCoordsFromClient(clientX, clientY) {
  const areaRect = canvasArea.getBoundingClientRect();
  const cx = (clientX - areaRect.left - offsetX) / scale;
  const cy = (clientY - areaRect.top  - offsetY) / scale;
  return {
    x: Math.floor(cx / PIXEL_SIZE),
    y: Math.floor(cy / PIXEL_SIZE),
  };
}

// ── Mouse events ───────────────────────────────────────────────────────────────
let mouseDownPos = null;
let didPan       = false;

canvasArea.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  mouseDownPos = { x: e.clientX, y: e.clientY };
  didPan       = false;
  isPanning    = true;
  panStart     = { x: e.clientX - offsetX, y: e.clientY - offsetY };
  canvasArea.style.cursor = 'grabbing';
});

canvasArea.addEventListener('mousemove', (e) => {
  if (isPanning) {
    const dx = Math.abs(e.clientX - mouseDownPos.x);
    const dy = Math.abs(e.clientY - mouseDownPos.y);
    if (dx > 4 || dy > 4) didPan = true;
    offsetX = e.clientX - panStart.x;
    offsetY = e.clientY - panStart.y;
    applyTransform();
  }

  const { x, y } = getCoordsFromClient(e.clientX, e.clientY);
  if (x >= 0 && x < W && y >= 0 && y < H) {
    coordTip.textContent   = `(${x}, ${y})`;
    coordTip.style.display = 'block';
  } else {
    coordTip.style.display = 'none';
  }
});

canvasArea.addEventListener('mouseup', (e) => {
  canvasArea.style.cursor = 'crosshair';
  isPanning = false;
  if (!didPan) handlePlace(e.clientX, e.clientY);
});

canvasArea.addEventListener('mouseleave', () => {
  isPanning = false;
  coordTip.style.display = 'none';
  canvasArea.style.cursor = 'crosshair';
});

// Scroll to zoom
canvasArea.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta    = e.deltaY > 0 ? 0.9 : 1.1;
  const areaRect = canvasArea.getBoundingClientRect();
  const mouseX   = e.clientX - areaRect.left;
  const mouseY   = e.clientY - areaRect.top;
  const newScale = Math.max(0.5, Math.min(10, scale * delta));
  offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
  offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
  scale   = newScale;
  applyTransform();
}, { passive: false });

// ── Touch events ───────────────────────────────────────────────────────────────
let touchStart   = null;
let touchDidMove = false;

canvasArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    touchStart   = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    touchDidMove = false;
    panStart     = { x: e.touches[0].clientX - offsetX, y: e.touches[0].clientY - offsetY };
    lastPinchDist = null;
  } else if (e.touches.length === 2) {
    lastPinchDist = getPinchDist(e.touches);
  }
}, { passive: false });

canvasArea.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    // Pinch zoom
    const dist    = getPinchDist(e.touches);
    if (lastPinchDist) {
      const delta    = dist / lastPinchDist;
      const midX     = (e.touches[0].clientX + e.touches[1].clientX) / 2 - canvasArea.getBoundingClientRect().left;
      const midY     = (e.touches[0].clientY + e.touches[1].clientY) / 2 - canvasArea.getBoundingClientRect().top;
      const newScale = Math.max(0.5, Math.min(10, scale * delta));
      offsetX = midX - (midX - offsetX) * (newScale / scale);
      offsetY = midY - (midY - offsetY) * (newScale / scale);
      scale   = newScale;
      applyTransform();
    }
    lastPinchDist = dist;
  } else if (e.touches.length === 1 && touchStart) {
    const dx = Math.abs(e.touches[0].clientX - touchStart.x);
    const dy = Math.abs(e.touches[0].clientY - touchStart.y);
    if (dx > 6 || dy > 6) touchDidMove = true;
    offsetX = e.touches[0].clientX - panStart.x;
    offsetY = e.touches[0].clientY - panStart.y;
    applyTransform();
  }
}, { passive: false });

canvasArea.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (!touchDidMove && e.changedTouches.length === 1) {
    handlePlace(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
  lastPinchDist = null;
}, { passive: false });

function getPinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

// ── Place pixel ────────────────────────────────────────────────────────────────
function handlePlace(clientX, clientY) {
  if (!SESSION) return;
  const { x, y } = getCoordsFromClient(clientX, clientY);
  if (x < 0 || x >= W || y < 0 || y >= H) return;

  // Close any open panels on canvas tap
  colorPanel.classList.remove('open');
  placementsPanel.classList.remove('open');

  const key       = `${x},${y}`;
  const pixel     = CANVAS_STATE[key];
  const existing  = placements.findIndex(p => p.x === x && p.y === y);

  if (existing !== -1) {
    // Re-color existing placement
    placements[existing].color = selectedColor;
    drawCanvas();
    updateUI();
    updateList();
    showToast(`Updated (${x}, ${y}) to ${selectedColor}`);
    return;
  }

  if (pixel?.protectedUntil > Date.now()) {
    const mins = Math.ceil((pixel.protectedUntil - Date.now()) / 60000);
    showToast(`Protected for ~${mins} more min. Pick another spot!`, 'warn');
    return;
  }

  if (placements.length >= credits) {
    showToast(`All ${credits} pixel${credits !== 1 ? 's' : ''} placed. Save or undo one first.`, 'warn');
    return;
  }

  placements.push({ x, y, color: selectedColor });
  drawCanvas();
  updateUI();
  updateList();
  showToast(`Placed at (${x}, ${y})`, 'ok');
}

// ── Palette ────────────────────────────────────────────────────────────────────
function buildPalette() {
  paletteEl.innerHTML = '';
  PALETTE.forEach(hex => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (hex === selectedColor ? ' selected' : '');
    sw.style.background = hex;
    sw.title = hex;
    sw.addEventListener('click', () => selectColor(hex));
    paletteEl.appendChild(sw);
  });
  colorToggle.style.background = selectedColor;
  document.getElementById('colorSwatchLg').style.background = selectedColor;
  document.getElementById('colorHex').textContent = selectedColor;
}

function selectColor(hex) {
  selectedColor = hex;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  const swatches = paletteEl.querySelectorAll('.swatch');
  swatches.forEach(s => { if (s.title === hex) s.classList.add('selected'); });
  colorToggle.style.background = hex;
  document.getElementById('colorSwatchLg').style.background = hex;
  document.getElementById('colorHex').textContent = hex;
  colorPanel.classList.remove('open');
}

// ── UI updates ─────────────────────────────────────────────────────────────────
function updateUI() {
  const remaining = credits - placements.length;
  creditsEl.textContent = remaining;
  placedEl.textContent  = placements.length;
  saveBadge.textContent = placements.length;
  btnSave.disabled  = placements.length === 0;
  btnUndo.disabled  = placements.length === 0;
}

function updateList() {
  if (placements.length === 0) {
    placementsList.innerHTML = '<div class="empty-list">No pixels placed yet.</div>';
    return;
  }
  placementsList.innerHTML = '';
  [...placements].reverse().forEach((p, ri) => {
    const i   = placements.length - 1 - ri;
    const row = document.createElement('div');
    row.className = 'placement-row';
    row.innerHTML = `
      <div class="placement-dot" style="background:${p.color};"></div>
      <span>(${p.x},${p.y})</span>
      <span style="font-size:9px;color:var(--muted);">${p.color}</span>
      <span class="placement-undo" data-idx="${i}" title="Remove">✕</span>
    `;
    placementsList.appendChild(row);
  });
  placementsList.querySelectorAll('.placement-undo').forEach(btn => {
    btn.addEventListener('click', () => {
      placements.splice(parseInt(btn.dataset.idx), 1);
      drawCanvas(); updateUI(); updateList();
    });
  });
}

// ── Timer ──────────────────────────────────────────────────────────────────────
function startTimer() {
  function tick() {
    const ms = expiresAt - Date.now();
    if (ms <= 0) {
      timerEl.textContent = 'Expired';
      timerEl.classList.add('urgent');
      showToast('Session expired. Pixel balance unchanged — use /pixel-place again.', 'error', 0);
      btnSave.disabled = true;
      return;
    }
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    timerEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
    timerEl.classList.toggle('urgent', m < 5);
    setTimeout(tick, 1000);
  }
  tick();
}

// ── Buttons ────────────────────────────────────────────────────────────────────
colorToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  placementsPanel.classList.remove('open');
  colorPanel.classList.toggle('open');
});

btnList.addEventListener('click', (e) => {
  e.stopPropagation();
  colorPanel.classList.remove('open');
  placementsPanel.classList.toggle('open');
  if (placementsPanel.classList.contains('open')) updateList();
});

document.addEventListener('click', () => {
  colorPanel.classList.remove('open');
  placementsPanel.classList.remove('open');
});

colorPanel.addEventListener('click', e => e.stopPropagation());
placementsPanel.addEventListener('click', e => e.stopPropagation());

btnUndo.addEventListener('click', () => {
  if (placements.length === 0) return;
  placements.pop();
  drawCanvas(); updateUI(); updateList();
});

btnZoomIn.addEventListener('click',    () => zoom(1.3));
btnZoomOut.addEventListener('click',   () => zoom(0.77));
btnZoomReset.addEventListener('click', () => resetView());

function zoom(factor) {
  const area    = canvasArea.getBoundingClientRect();
  const cx      = area.width  / 2;
  const cy      = area.height / 2;
  const newScale = Math.max(0.5, Math.min(10, scale * factor));
  offsetX = cx - (cx - offsetX) * (newScale / scale);
  offsetY = cy - (cy - offsetY) * (newScale / scale);
  scale   = newScale;
  applyTransform();
}

btnSave.addEventListener('click', async () => {
  if (placements.length === 0) return;
  btnSave.disabled = true;
  btnSave.textContent = 'Saving…';

  try {
    const updated = { ...SESSION, placements, status: 'submitted' };
    await patchGist(gistId, 'pixel-session.json', updated);
    doneScreen.style.display = 'flex';
  } catch (err) {
    console.error(err);
    showToast('Save failed: ' + err.message + ' — please try again.', 'error');
    btnSave.disabled = false;
    btnSave.innerHTML = `✅ Save &amp; Return <span class="save-badge">${placements.length}</span>`;
  }
});

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer = null;
const toastEl  = document.getElementById('toast');

function showToast(msg, type = '', duration = 3000) {
  toastEl.textContent = msg;
  toastEl.className   = `toast ${type} show`;
  clearTimeout(toastTimer);
  if (duration > 0) {
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }
}
</script>
