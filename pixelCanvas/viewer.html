<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASIC × DONKEY — Pixel Canvas Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow:   #FFE033;
    --yellow2:  #FFB800;
    --black:    #0E0E0E;
    --offblack: #181818;
    --panel:    #1E1E1E;
    --panel2:   #252525;
    --border:   #2E2E2E;
    --border2:  #3D3D3D;
    --white:    #F5F5F0;
    --muted:    #6A6A6A;
    --green:    #3DDB6F;
    --red:      #FF4D4D;
    --blue:     #5b9fff;
    --pixel:    'Press Start 2P', monospace;
    --mono:     'DM Mono', monospace;
    --sans:     'DM Sans', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,224,51,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,224,51,0.04) 1px, transparent 1px);
    background-size: 16px 16px;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 700px;
    padding: 0 0 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  /* ── Header ── */
  .header {
    width: 100%;
    background: var(--yellow);
    padding: 20px 20px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--black);
    position: relative;
    overflow: hidden;
    margin-bottom: 2px;
  }

  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 8px 8px;
    pointer-events: none;
  }

  .header-left {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    z-index: 1;
  }

  .collab-label {
    font-family: var(--pixel);
    font-size: 6px;
    color: rgba(0,0,0,0.45);
    letter-spacing: .1em;
  }

  .header h1 {
    font-family: var(--pixel);
    font-size: 10px;
    color: var(--black);
    letter-spacing: .04em;
    line-height: 1.6;
  }

  /* Live badge */
  .live-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--black);
    padding: 8px 12px;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }

  .live-dot {
    width: 7px; height: 7px;
    background: var(--green);
    flex-shrink: 0;
    animation: pixblink 1.4s steps(1) infinite;
  }

  @keyframes pixblink {
    0%, 60% { opacity: 1; }
    61%, 100% { opacity: 0; }
  }

  .live-dot.loading { background: var(--yellow); animation: none; opacity: 1; }

  .live-text {
    font-family: var(--pixel);
    font-size: 6px;
    color: var(--white);
    letter-spacing: .08em;
    white-space: nowrap;
  }

  /* ── Stats bar ── */
  .stats-bar {
    width: 100%;
    display: flex;
    background: var(--panel);
    border-bottom: 2px solid var(--border);
  }

  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 12px 8px;
    border-right: 2px solid var(--border);
  }
  .stat:last-child { border-right: none; }

  .stat-label {
    font-family: var(--pixel);
    font-size: 5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat-value {
    font-family: var(--pixel);
    font-size: 13px;
    color: var(--white);
    line-height: 1;
  }
  .stat-value.yellow { color: var(--yellow); }
  .stat-value.green  { color: var(--green); }

  /* ── Canvas wrap ── */
  .canvas-wrap {
    width: 100%;
    background: var(--offblack);
    border-bottom: 2px solid var(--border);
    overflow: hidden;
    position: relative;
  }

  #pixelCanvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
  }

  /* Coord tip */
  .coord-tip {
    position: absolute;
    background: var(--black);
    border: 1px solid var(--yellow);
    padding: 3px 8px;
    font-family: var(--pixel);
    font-size: 7px;
    color: var(--yellow);
    pointer-events: none;
    display: none;
    white-space: nowrap;
    z-index: 10;
  }

  /* Pixel popup */
  .pixel-popup {
    position: absolute;
    background: var(--offblack);
    border: 2px solid var(--border2);
    border-top: 2px solid var(--yellow);
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--white);
    pointer-events: none;
    display: none;
    z-index: 20;
    min-width: 150px;
  }

  .pixel-popup-color {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border);
  }

  .pixel-popup-dot {
    width: 14px; height: 14px;
    border: 1px solid var(--border2);
    flex-shrink: 0;
  }

  .pixel-popup-hex {
    font-family: var(--pixel);
    font-size: 8px;
    color: var(--white);
  }

  .pixel-popup-row {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.9;
  }
  .pixel-popup-row span { color: var(--white); }
  .pixel-popup-row .prot { color: var(--blue); }

  /* ── Loading ── */
  #loadScreen {
    position: fixed;
    inset: 0;
    background: var(--black);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .pixel-loader {
    display: grid;
    grid-template-columns: repeat(5, 10px);
    grid-template-rows: repeat(5, 10px);
    gap: 3px;
  }

  .pixel-loader div {
    animation: pixelblink 1s steps(1) infinite;
  }
  .pixel-loader div:nth-child(odd)  { animation-delay: 0s; }
  .pixel-loader div:nth-child(even) { animation-delay: .5s; }
  @keyframes pixelblink {
    0%, 49% { background: var(--yellow); }
    50%, 100% { background: var(--border); }
  }

  .load-text {
    font-family: var(--pixel);
    font-size: 8px;
    color: var(--muted);
    letter-spacing: .12em;
  }

  /* ── Footer ── */
  .footer {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    line-height: 2;
    padding: 16px;
  }

  .footer a {
    color: var(--yellow);
    text-decoration: none;
  }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="loadScreen">
  <div class="pixel-loader">
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
    <div></div><div></div><div></div><div></div><div></div>
  </div>
  <div class="load-text">Loading canvas…</div>
</div>

<div class="page">

  <div class="header">
    <div class="header-left">
      <div class="collab-label">JOINT VENTURE · LIVE VIEW</div>
      <h1>BASIC × DONKEY<br>PIXEL CANVAS</h1>
    </div>
    <div class="live-badge">
      <div class="live-dot" id="liveDot"></div>
      <div class="live-text" id="liveText">LIVE</div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-label">Placed</div>
      <div class="stat-value yellow" id="statPlaced">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Canvas</div>
      <div class="stat-value" id="statSize">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Filled</div>
      <div class="stat-value green" id="statPct">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Updated</div>
      <div class="stat-value" id="statUpdated">—</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="pixelCanvas"></canvas>
    <div class="coord-tip" id="coordTip"></div>
    <div class="pixel-popup" id="pixelPopup">
      <div class="pixel-popup-color">
        <div class="pixel-popup-dot" id="popupDot"></div>
        <span class="pixel-popup-hex" id="popupColor">#FFFFFF</span>
      </div>
      <div class="pixel-popup-row">Coords: <span id="popupCoords">—</span></div>
      <div class="pixel-popup-row">Owner: <span id="popupOwner">—</span></div>
      <div class="pixel-popup-row">Protected: <span id="popupProt" class="prot">—</span></div>
    </div>
  </div>

  <div class="footer">
    Hover to inspect · Click to pin pixel info · Canvas auto-refreshes every 30s<br>
    Buy pixels on <a href="https://basicquilt.github.io/puffin-swap-redirect/canvas/" target="_blank" rel="noopener">the web</a> or in the Basic &amp; Donkey Discord servers
  </div>

</div>

<script>
const CANVAS_STATE_GIST_ID = '65adc252cd7c38d8b03e74e268ea7340';
const REFRESH_INTERVAL_MS  = 30000;
const PIXEL_SIZE           = 8;

let CANVAS_STATE = {};
let W = 64, H = 64;
let pinnedPixel  = null;
let countdown    = 30;

const canvas      = document.getElementById('pixelCanvas');
const ctx         = canvas.getContext('2d');
const loadScreen  = document.getElementById('loadScreen');
const coordTip    = document.getElementById('coordTip');
const pixelPopup  = document.getElementById('pixelPopup');
const liveDot     = document.getElementById('liveDot');
const liveText    = document.getElementById('liveText');

(async () => {
  await loadCanvas();
  loadScreen.style.display = 'none';
  startRefreshCycle();
})();

async function loadCanvas() {
  liveDot.classList.add('loading');
  liveText.textContent = 'UPDATING…';

  try {
    const res = await fetch(
      `https://api.github.com/gists/${CANVAS_STATE_GIST_ID}`,
      { headers: { 'Accept': 'application/vnd.github+json' } }
    );
    if (!res.ok) throw new Error(`Gist fetch failed (${res.status})`);
    const data    = await res.json();
    const content = data.files?.['canvas-state.json']?.content;
    if (!content) throw new Error('canvas-state.json not found in Gist');

    const state   = JSON.parse(content);
    CANVAS_STATE  = state.pixels || {};
    W             = state.width  || 64;
    H             = state.height || 64;

    canvas.width  = W * PIXEL_SIZE;
    canvas.height = H * PIXEL_SIZE;

    drawCanvas();
    updateStats(state);
  } catch (err) {
    console.error('Error loading canvas:', err);
  }

  liveDot.classList.remove('loading');
  liveText.textContent = 'LIVE';
}

function drawCanvas() {
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const now = Date.now();

  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) {
      const key   = `${x},${y}`;
      const pixel = CANVAS_STATE[key];
      const color = pixel?.color || '#FFFFFF';

      ctx.fillStyle = color;
      ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);

      if (pixel?.protectedUntil > now) {
        ctx.fillStyle = 'rgba(91,159,255,0.28)';
        ctx.fillRect(x * PIXEL_SIZE, y * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
      }
    }
  }

  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.lineWidth   = 0.5;
  for (let x = 0; x <= W; x++) {
    ctx.beginPath();
    ctx.moveTo(x * PIXEL_SIZE, 0);
    ctx.lineTo(x * PIXEL_SIZE, H * PIXEL_SIZE);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * PIXEL_SIZE);
    ctx.lineTo(W * PIXEL_SIZE, y * PIXEL_SIZE);
    ctx.stroke();
  }

  if (pinnedPixel) highlightPixel(pinnedPixel.x, pinnedPixel.y);
}

function highlightPixel(x, y) {
  ctx.strokeStyle = '#FFE033';
  ctx.lineWidth   = 2;
  ctx.strokeRect(
    x * PIXEL_SIZE + 1,
    y * PIXEL_SIZE + 1,
    PIXEL_SIZE - 2,
    PIXEL_SIZE - 2
  );
}

function updateStats(state) {
  const placed  = Object.keys(state.pixels || {}).length;
  const total   = W * H;
  const pct     = ((placed / total) * 100).toFixed(1);
  const updated = state.updatedAt
    ? new Date(state.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : '—';

  document.getElementById('statPlaced').textContent  = placed.toLocaleString();
  document.getElementById('statSize').textContent    = `${W}×${H}`;
  document.getElementById('statPct').textContent     = `${pct}%`;
  document.getElementById('statUpdated').textContent = updated;
}

function startRefreshCycle() {
  setTimeout(() => {
    loadCanvas().then(() => startRefreshCycle());
  }, REFRESH_INTERVAL_MS);
}

function getCoords(e) {
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const touch  = e.touches?.[0] || e;
  return {
    x: Math.floor((touch.clientX - rect.left) * scaleX / PIXEL_SIZE),
    y: Math.floor((touch.clientY - rect.top)  * scaleY / PIXEL_SIZE),
  };
}

function showPopup(x, y, clientX, clientY) {
  const key   = `${x},${y}`;
  const pixel = CANVAS_STATE[key];
  const color = pixel?.color || '#FFFFFF';
  const isProtected = pixel?.protectedUntil > Date.now();
  const remaining   = isProtected
    ? Math.ceil((pixel.protectedUntil - Date.now()) / 60000) + ' min'
    : 'No';
  const owner = pixel?.ownerName || (pixel?.color && pixel.color !== '#FFFFFF' ? 'Unknown' : 'Empty');

  document.getElementById('popupDot').style.background = color;
  document.getElementById('popupColor').textContent    = color;
  document.getElementById('popupCoords').textContent   = `(${x}, ${y})`;
  document.getElementById('popupOwner').textContent    = owner;
  document.getElementById('popupProt').textContent     = remaining;

  const wrap   = document.getElementById('canvasWrap');
  const wRect  = wrap.getBoundingClientRect();
  const popupW = 160;
  const popupH = 100;
  let left = clientX - wRect.left + 12;
  let top  = clientY - wRect.top  - popupH - 8;
  if (left + popupW > wRect.width) left = clientX - wRect.left - popupW - 8;
  if (top < 0) top = clientY - wRect.top + 16;

  pixelPopup.style.left    = `${left}px`;
  pixelPopup.style.top     = `${top}px`;
  pixelPopup.style.display = 'block';
}

canvas.addEventListener('mousemove', (e) => {
  if (pinnedPixel) return;
  const { x, y } = getCoords(e);
  if (x < 0 || x >= W || y < 0 || y >= H) {
    coordTip.style.display   = 'none';
    pixelPopup.style.display = 'none';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  coordTip.textContent   = `(${x}, ${y})`;
  coordTip.style.display = 'block';
  coordTip.style.left    = `${e.clientX - rect.left + 12}px`;
  coordTip.style.top     = `${Math.max(e.clientY - rect.top - 28, 4)}px`;
  showPopup(x, y, e.clientX, e.clientY);
});

canvas.addEventListener('mouseleave', () => {
  if (pinnedPixel) return;
  coordTip.style.display   = 'none';
  pixelPopup.style.display = 'none';
});

canvas.addEventListener('click', (e) => {
  const { x, y } = getCoords(e);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (pinnedPixel && pinnedPixel.x === x && pinnedPixel.y === y) {
    pinnedPixel = null;
    pixelPopup.style.display = 'none';
    drawCanvas();
  } else {
    pinnedPixel = { x, y };
    drawCanvas();
    showPopup(x, y, e.clientX, e.clientY);
  }
});

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  const { x, y } = getCoords(touch);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (pinnedPixel && pinnedPixel.x === x && pinnedPixel.y === y) {
    pinnedPixel = null;
    pixelPopup.style.display = 'none';
    drawCanvas();
  } else {
    pinnedPixel = { x, y };
    drawCanvas();
    showPopup(x, y, touch.clientX, touch.clientY);
  }
}, { passive: false });
</script>
</body>
</html>
